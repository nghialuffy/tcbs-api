# ReadTheDocs build configuration (https://tcbs-api.readthedocs.io/).
#
# The site is built by MkDocs from `mkdocs.yml`; the dependencies come from the `docs` extra in
# pyproject.toml, which is also what `uv sync` installs for local previews.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # Also installs `tcbs_api` itself, which mkdocstrings imports to read the signatures and
    # docstrings it renders.
    - method: pip
      path: .
      extra_requirements:
        - docs
